<ion-header>
  <ion-toolbar>
    <ion-title>Home</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="goSettings()">Settings</ion-button>
      <ion-button color="danger" (click)="logout()">Logout</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <p *ngIf="username">Welcome, {{username}}!</p>

  <ion-button expand="block" (click)="openResume()">View Resume (new tab)</ion-button>
  <ion-button expand="block" fill="outline" (click)="openResumeEmbedded()">View Resume (in app)</ion-button>

  <ion-list>
    <ion-item *ngFor="let it of items" (click)="openDetail(it.id)">
      <ion-label>
        <h2>{{it.title}}</h2>
        <p>{{it.subtitle}}</p>
      </ion-label>
      <ion-note slot="end">›</ion-note>
    </ion-item>
  </ion-list>
</ion-content>
